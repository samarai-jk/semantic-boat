# B1S registry: every number the B1S protocol assigns.
#
# Rules: README.md in this directory, section "Adding to B1S". In short:
# reuse before adding; append with the next free code; never reuse,
# renumber, or redefine a code; deprecate instead of changing a quantity's
# unit, scale, or encoding. Generated code (firmware headers, can-bench and
# canboat definitions, the Signal K plugin) will be produced from this file;
# it is the single source of truth.

manufacturer_code: 2046   # n2k::manufacturerCode; not assigned by NMEA, never registered
industry_code: 4          # marine
proprietary_header: 0x9FFE  # sent as FE 9F

# B1S proprietary PGNs. Layouts: README.md, "B1S messages".
pgns:
  - {pgn: 65280,  id: measurement,         kind: single,  addressing: broadcast}
  - {pgn: 65281,  id: outputStatus,        kind: single,  addressing: broadcast}
  - {pgn: 130816, id: measurementWide,     kind: fast,    addressing: broadcast}
  - {pgn: 130817, id: measurementSummary,  kind: fast,    addressing: broadcast}
  - {pgn: 130818, id: event,               kind: fast,    addressing: broadcast}
  - {pgn: 130819, id: channelDescription,  kind: fast,    addressing: broadcast}
  - {pgn: 61184,  id: command,             kind: single,  addressing: addressed}
  - {pgn: 126720, id: service,             kind: fast,    addressing: addressed}

# Standard NMEA 2000 PGNs that B1S devices may send, with their category.
# display: shown only; default encoding "standard".
# navigation: chartplotters select sources for it; default encoding "b1s",
#   and Signal K forwards it to NMEA 2000 only deliberately.
# Network management PGNs (59392, 59904, 60928, 126464, 126993, 126996,
# 126998) are always sent and not listed. When in doubt: navigation.
standard_pgns:
  - {pgn: 127488, name: Engine Parameters Rapid Update,  category: display}
  - {pgn: 127501, name: Binary Switch Bank Status,       category: display}
  - {pgn: 127508, name: Battery Status,                  category: display}
  - {pgn: 130313, name: Humidity,                        category: display}
  - {pgn: 130314, name: Actual Pressure,                 category: display}
  - {pgn: 130316, name: Temperature Extended Range,      category: display}
  - {pgn: 126983, name: Alert,                           category: navigation}
  - {pgn: 126984, name: Alert Response,                  category: navigation}
  - {pgn: 126985, name: Alert Text,                      category: navigation}
  - {pgn: 126992, name: System Time,                     category: navigation}
  - {pgn: 127245, name: Rudder,                          category: navigation}
  - {pgn: 127250, name: Vessel Heading,                  category: navigation}
  - {pgn: 127251, name: Rate of Turn,                    category: navigation}
  - {pgn: 127257, name: Attitude,                        category: navigation}
  - {pgn: 127258, name: Magnetic Variation,              category: navigation}
  - {pgn: 128259, name: Speed,                           category: navigation}
  - {pgn: 128267, name: Water Depth,                     category: navigation}
  - {pgn: 129025, name: Position Rapid Update,           category: navigation}
  - {pgn: 129026, name: COG and SOG Rapid Update,        category: navigation}
  - {pgn: 129029, name: GNSS Position Data,              category: navigation}
  - {pgn: 130306, name: Wind Data,                       category: navigation}

# Values of the source field of standard PGNs (canboat lookups
# TEMPERATURE_SOURCE, HUMIDITY_SOURCE, PRESSURE_SOURCE). Signal K builds the
# path of a standard PGN from it: 130316 source 0 (sea) is
# environment.water.temperature, the boat's sea temperature.
standard_sources:
  130316: {0: sea, 1: outside, 2: inside, 3: engineRoom, 4: mainCabin, 5: liveWell, 6: baitWell, 7: refrigeration,
           8: heatingSystem, 9: dewPoint, 10: apparentWindChill, 11: theoreticalWindChill, 12: heatIndex, 13: freezer,
           14: exhaustGas, 15: shaftSeal}
  130313: {0: inside, 1: outside}
  130314: {0: atmospheric, 1: water, 2: steam, 3: compressedAir, 4: hydraulic, 5: filter, 6: altimeterSetting, 7: oil, 8: fuel}

# Quantities of the Measurement messages. Physical value = raw x scale, in
# the SI unit (as Signal K). signalk: path template; {location} is the
# channel's location from its Channel Description. standard_pgn: the
# standard PGN a channel of this quantity can be sent as (firmware:
# n2k::standardPgn()). Code 0 is invalid, 255 reserved.
quantities:
  - {code: 1,  id: temperature,        unit: K,      scale: 0.001, encoding: int32, signalk: "environment.{location}.temperature", standard_pgn: 130316}
  - {code: 2,  id: relativeHumidity,   unit: ratio,  scale: 1.0e-6, encoding: int32, signalk: "environment.{location}.relativeHumidity", standard_pgn: 130313}
  - {code: 3,  id: pressure,           unit: Pa,     scale: 0.1,   encoding: int32, signalk: "environment.{location}.pressure", standard_pgn: 130314}
  - {code: 4,  id: voltage,            unit: V,      scale: 0.001, encoding: int32, signalk: "electrical.{location}.voltage"}
  - {code: 5,  id: current,            unit: A,      scale: 0.001, encoding: int32, signalk: "electrical.{location}.current"}
  - {code: 6,  id: power,              unit: W,      scale: 0.001, encoding: int32, signalk: "electrical.{location}.power"}
  - {code: 7,  id: energy,             unit: J,      scale: 1,     encoding: int32, signalk: "electrical.{location}.energy",
     description: "Use Measurement Wide for running totals above about 596 kWh"}
  - {code: 8,  id: frequency,          unit: Hz,     scale: 0.001, encoding: int32, signalk: "{location}.frequency"}
  - {code: 9,  id: rotationalSpeed,    unit: Hz,     scale: 0.001, encoding: int32, signalk: "propulsion.{location}.revolutions", standard_pgn: 127488,
     description: "Revolutions per second, as Signal K (rpm / 60)"}
  - {code: 10, id: illuminance,        unit: lx,     scale: 0.001, encoding: int32, signalk: "environment.{location}.illuminance"}
  - {code: 11, id: uvIndex,            unit: "1",    scale: 0.001, encoding: int32, signalk: "environment.{location}.uvIndex"}
  - {code: 12, id: co2,                unit: ratio,  scale: 1.0e-9, encoding: int32, signalk: "environment.{location}.co2",
     description: "CO2 mole fraction; 1 ppm = 1000 raw"}
  - {code: 13, id: angle,              unit: rad,    scale: 1.0e-6, encoding: int32, signalk: "{location}.angle",
     description: "Generic angle; prefer a specific quantity (heading, pitch, roll) when one exists"}
  - {code: 14, id: heading,            unit: rad,    scale: 1.0e-6, encoding: int32, signalk: "{location}.heading",
     description: "Magnetic heading of a sensor, not of the vessel (that is PGN 127250, navigation)"}
  - {code: 15, id: pitch,              unit: rad,    scale: 1.0e-6, encoding: int32, signalk: "{location}.pitch",
     description: "Bow up positive"}
  - {code: 16, id: roll,               unit: rad,    scale: 1.0e-6, encoding: int32, signalk: "{location}.roll",
     description: "Starboard down positive"}
  - {code: 17, id: angularVelocity,    unit: rad/s,  scale: 1.0e-6, encoding: int32, signalk: "{location}.angularVelocity"}
  - {code: 18, id: acceleration,       unit: m/s2,   scale: 1.0e-4, encoding: int32, signalk: "{location}.acceleration"}
  - {code: 19, id: distance,           unit: m,      scale: 0.001, encoding: int32, signalk: "{location}.distance"}
  - {code: 20, id: speed,              unit: m/s,    scale: 0.001, encoding: int32, signalk: "{location}.speed"}
  - {code: 21, id: ratio,              unit: ratio,  scale: 1.0e-6, encoding: int32, signalk: "{location}.ratio",
     description: "Dimensionless 0..1 (levels, duty, state of charge) when no specific quantity exists"}
  - {code: 22, id: count,              unit: "1",    scale: 1,     encoding: int32, signalk: "{location}.count"}
  - {code: 23, id: duration,           unit: s,      scale: 0.001, encoding: int32, signalk: "{location}.duration"}

# Event types of the Event message; parameters are int32 in the given units.
events:
  - {code: 1, id: lightningStrike, parameters: [{name: distance, unit: m, scale: 1}, {name: energy, unit: "1", scale: 1, description: "Sensor-specific raw energy"}]}

# Output kinds of Output Status and Channel Description.
output_kinds:
  - {code: 1, id: relay,      description: "On/off switched load"}
  - {code: 2, id: dimmer,     description: "PWM or constant-current load with a level"}
  - {code: 3, id: fan,        description: "Fan with a speed level"}

# Commands of the Command message (61184). Bit 7 of the code marks a reply.
commands:
  - {code: 1, id: identify,  argument: "uint16 seconds (bytes 4..5), bytes 6..7 0xFF", description: "Make the device visible (blink an LED, beep); 0 stops"}
  - {code: 2, id: setState,  argument: "uint8 0 off, 1 on (byte 4), bytes 5..7 0xFF", description: "Switch an output channel"}
  - {code: 3, id: setLevel,  argument: "uint16 level 0.01 % (bytes 4..5), uint16 fade time 0.01 s (bytes 6..7)", description: "Set an output channel's level"}
  - {code: 4, id: calibrate, argument: "int32 reference, channel quantity units", description: "Offset calibration of a measurement channel against a reference at its current reading"}
  - {code: 5, id: calibrateSecondPoint, argument: "int32 reference, channel quantity units", description: "Second point after calibrate: gain and offset from both points (at least one unit apart)"}
  - {code: 6, id: resetChannel, argument: "none (0xFF)", description: "Calibration and alarm thresholds of a measurement channel back to defaults"}
  - {code: 7, id: acknowledgeAlarms, argument: "none (0xFF), channel 0xFF", description: "Acknowledge all alarms of the device, like a button"}
  - {code: 8, id: restart, argument: "none (0xFF), channel 0xFF", description: "Restart the device after the reply"}
  - {code: 9, id: enterBootloader, argument: "none (0xFF), channel 0xFF", description: "Restart into the bootloader for a firmware update (FIRMWARE.md)"}

# Service codes of the Service message (126720); layouts in CONFIGURATION.md.
services:
  - {code: 1, id: parameterList,  description: "Ids of the parameters the device has"}
  - {code: 2, id: parameterRead,  description: "Value of a parameter"}
  - {code: 3, id: parameterWrite, description: "Store a parameter; the reply carries the stored value"}
  - {code: 4, id: console,        description: "Run a console command line; the device log follows as replies for 30 s"}
  - {code: 5, id: firmwareBegin,  description: "Bootloader: start an update with the image header (FIRMWARE.md)"}
  - {code: 6, id: firmwareData,   description: "Bootloader: a chunk of the image at an offset"}
  - {code: 7, id: firmwareEnd,    description: "Bootloader: check the image and start it"}
  - {code: 8, id: logStream,      description: "Stream the device log to the requester for some minutes (rate limited; stops by itself)"}

# Parameters for configuration over CAN (CONFIGURATION.md). scope: device or
# channel. type: wire value int32 for uint8/uint16/uint32/int32/bool/enum,
# string (ASCII, at most 32 characters) for string. unit: quantity = the
# channel quantity's raw unit (absolute value), quantityDelta = the same
# scale for differences (no offset, e.g. kelvin not degrees Celsius),
# otherwise an SI unit. access: rw = stored and backed up, ro = state.
parameters:
  - {code: 1,  id: deviceRole,              scope: device,  type: string, access: rw, description: "Device role, e.g. fridgeSensor; empty = unassigned"}
  - {code: 3,  id: preferredAddress,        scope: device,  type: uint8,  access: rw, restart: true, description: "Address the device claims first"}
  - {code: 16, id: channelLocation,         scope: channel, type: string, access: rw, description: "Signal K path fragment of the channel; empty = unassigned"}
  - {code: 17, id: channelLabel,            scope: channel, type: string, access: rw, description: "Channel name for people"}
  - {code: 18, id: channelEncoding,         scope: channel, type: enum,   access: rw, values: [automatic, standard, b1s, "off"], description: "Encoding switch (README, Standard PGNs); automatic = the channel's firmware default, a B1S message unless the firmware chose otherwise"}
  - {code: 19, id: channelStandardInstance, scope: channel, type: uint8,  access: rw, description: "Instance of the standard PGN; 255 = the firmware default"}
  - {code: 20, id: channelStandardSource,   scope: channel, type: uint8,  access: rw, description: "Source field of the standard PGN (standard_sources); 255 = the firmware default"}
  - {code: 32, id: calibrationOffset,       scope: channel, type: int32,  access: rw, unit: quantityDelta, description: "value = raw x gain + offset"}
  - {code: 33, id: calibrationGain,         scope: channel, type: int32,  access: rw, unit: ppm, description: "Gain in millionths (1000000 = 1)"}
  - {code: 40, id: alarmThreshold0,         scope: channel, type: int32,  access: rw, unit: alarmRule, description: "Threshold of alarm rule 0; absolute (quantity) for high/low, quantityDelta per minute for rise rate, quantityDelta for trends"}
  - {code: 41, id: alarmThreshold1,         scope: channel, type: int32,  access: rw, unit: alarmRule, description: "Threshold of alarm rule 1"}
  - {code: 42, id: alarmThreshold2,         scope: channel, type: int32,  access: rw, unit: alarmRule, description: "Threshold of alarm rule 2"}
  - {code: 43, id: alarmThreshold3,         scope: channel, type: int32,  access: rw, unit: alarmRule, description: "Threshold of alarm rule 3"}
  - {code: 44, id: alarmRule0,              scope: channel, type: uint32, access: ro, description: "Kind (bits 0..7: 0 high, 1 low, 2 rise rate, 3 sensor fault, 4 trend fall, 5 trend rise), severity (bits 8..15: 0 warning, 1 alarm, 2 emergency), bit 16 latching, bit 17 active, bit 18 acknowledged"}
  - {code: 45, id: alarmRule1,              scope: channel, type: uint32, access: ro, description: "As alarmRule0, rule 1"}
  - {code: 46, id: alarmRule2,              scope: channel, type: uint32, access: ro, description: "As alarmRule0, rule 2"}
  - {code: 47, id: alarmRule3,              scope: channel, type: uint32, access: ro, description: "As alarmRule0, rule 3"}
  - {code: 64, id: uptime,                  scope: device,  type: uint32, access: ro, unit: s, description: "Time since the last start"}

# Boards that run B1S firmware with a bootloader (FIRMWARE.md); the image
# header names the board an image is built for.
boards:
  - {code: 1, id: canMcuV1, description: "can-mcu V1.0 (STM32L431CC): bootloader 16 KB at 0x08000000, application 224 KB at 0x08004000"}

# Device types. product_code: 126996; preferred_address: start address of
# the claim; device_class/device_function: NMEA 2000 NAME table;
# frames_per_second: typical bus load for the 30 % budget.
products:
  - {product_code: 1, id: lab-test-01, model: "Semantic Boat LT1", preferred_address: 35,
     device_class: 75, device_function: 130, frames_per_second: 3,
     description: "can-mcu + host-dev lab device (src/dev/can-mcu/lab-test-01)"}
  - {product_code: 2, id: can-mcu-bootloader, model: "Semantic Boat can-mcu bootloader", preferred_address: 240,
     device_class: 10, device_function: 130, frames_per_second: 0.1,
     description: "Bootloader of can-mcu devices while it waits for or receives a firmware update (src/dev/can-mcu/can-mcu-bootloader)"}
